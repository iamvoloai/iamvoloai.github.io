    }
    .cloud {
      position: absolute;
      filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.06));
    }
    .cloud path {
      fill: #FFFFFF;
      stroke: #d4e8f0;
      stroke-width: 1.5;
    }

    /* ===== WATERMARK ===== */
    .watermark {
      position: fixed;
      top: 50%; left: 0; right: 0;
      text-align: center;
      transform: translateY(-50%);
      font-family: 'Fredoka One', cursive;
      font-size: clamp(60px, 16vw, 130px);
      color: #F5C518;
      text-shadow: 3px 4px 0 #D4A012;
      opacity: 0.12;
      white-space: nowrap;
      pointer-events: none; z-index: 0;
      letter-spacing: -1px;
    }

    /* ===== CONTAINER ===== */
    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
    }

    /* ===== AVATAR ===== */
    .avatar {
      width: 120px; height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      border: 3px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.15);
    }

    /* ===== TITLE ===== */
    .title {
      font-family: 'Fredoka One', cursive;
      font-size: 32px; font-weight: 400;
      color: #F5C518;
      text-shadow: 2px 3px 0 #D4A012;
      margin-top: 14px;
      letter-spacing: 0.5px;
    }

    /* ===== TAGLINE ===== */
    .tagline {
      font-weight: 500; font-size: 14px;
      color: rgba(255,255,255,0.85);
      line-height: 1.5;
      margin-top: 10px;
    }

    /* ===== ICON LINKS ===== */
    .icon-links {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      align-items: flex-start;
      justify-content: center;
    }

    .icon-link {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      text-decoration: none;
      transition: transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-link:hover { transform: scale(1.08); }
    .icon-link:active { transform: scale(0.95); }

    .icon-circle {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: #F5C518;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      transition: box-shadow 0.15s;
      pointer-events: none;
    }
    .icon-link:hover .icon-circle {
      box-shadow: 0 5px 14px rgba(0,0,0,0.2);
    }
    .icon-circle svg {
      width: 24px; height: 24px;
      fill: #1a1a1a;
      pointer-events: none;
    }

    .icon-label {
      font-family: 'Inter', sans-serif;
      font-weight: 600; font-size: 11px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      pointer-events: none;
    }

      margin-top: 32px; font-size: 11px;
